name: Set up cocogitto
description: Install a pinned, checksum-verified cocogitto (cog) binary.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        COG_VERSION: 7.0.0
        COG_SHA256: e03938ff2c4c86d71c00c0f3284dbbe95c5ca76fe34a51f33e945c23010d59bb
      run: |
        set -euo pipefail
        tgz="$RUNNER_TEMP/cog.tar.gz"
        curl -fsSL -o "$tgz" "https://github.com/cocogitto/cocogitto/releases/download/${COG_VERSION}/cocogitto-${COG_VERSION}-x86_64-unknown-linux-musl.tar.gz"
        echo "${COG_SHA256}  $tgz" | sha256sum -c -
        mkdir -p "$RUNNER_TEMP/cog"
        tar -xzf "$tgz" -C "$RUNNER_TEMP/cog" --strip-components=1 x86_64-unknown-linux-musl/cog
        echo "$RUNNER_TEMP/cog" >> "$GITHUB_PATH"
