#
# Squash merges use the PR title as the commit message, and cocogitto reads
# it to pick the next version, so the title must be a conventional commit.
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-cog
      - name: Verify PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # cog reads the git identity even when only verifying a message.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cog verify "$TITLE"
