name: build

# Pushes to main are built by release.yml (which calls this workflow for the
# new tag). A manually pushed v* tag still builds and releases here.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        required: true
      version:
        description: Package version
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # release step publishes to GitHub Releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Compute version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION}" ]; then
            echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Test and build in FreeBSD
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          release: "15.1"
          usesh: true
          envs: VERSION
          prepare: pkg install -y hs-ShellCheck node php85 libxml2
          run: |
            set -e
            sh tests/run.sh
            sh build.sh "${VERSION}"
            cd dist
            for p in *.pkg; do sha256 -r "$p" > "$p.sha256"; done
        env:
          VERSION: ${{ steps.ver.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pfSense-pkg-speedtest
          path: |
            dist/*.pkg
            dist/*.sha256
      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/*.pkg
            dist/*.sha256
